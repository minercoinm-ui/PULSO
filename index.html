    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        function isExtensionNoise(err, filename) {
          var msg = '';
          var stack = '';
          if (typeof err === 'string') {
            msg = err;
          } else if (err && typeof err === 'object') {
            msg = String(err.message || '');
            stack = String(err.stack || '');
          }
          var src = String(filename || '') + ' ' + stack;
          if (
            src.indexOf('chrome-extension://') !== -1 ||
            src.indexOf('moz-extension://') !== -1 ||
            src.indexOf('safari-extension://') !== -1
          ) {
            return true;
          }
          return msg.indexOf('Failed to connect to MetaMask') !== -1;
        }
        window.addEventListener(
          'unhandledrejection',
          function (event) {
            if (isExtensionNoise(event.reason, '')) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );
        window.addEventListener(
          'error',
          function (event) {
            if (isExtensionNoise(event.error || event.message, event.filename)) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );
      })();
    </script>
